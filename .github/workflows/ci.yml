name: Go CI

env:
  CGO_ENABLED: 1
  ONNX_LIB_DIR: ${{ github.workspace }}/models/onnx_runtime/lib
  TOKENIZER_LIB_DIR: ${{ github.workspace }}/tokenizerLib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies for CGO
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev
        make setup-deps

    - name: Run tests with coverage
      run: |
        make test
        go tool cover -html=coverage.out -o coverage.html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella-${{ runner.os }}

    - name: Run go vet
      run: go vet ./...

    - name: Run golangci-lint
      if: runner.os != 'Windows'
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        install-mode: goinstall
        args: --out-format=colored-line-number --timeout=5m

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi
      if: runner.os != 'Windows'

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ runner.os }}
        path: |
          coverage.out
          coverage.html

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies for CGO
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev
        make setup-deps

    - name: Build
      run: make build
      env:
        CGO_ENABLED: 1
        LD_LIBRARY_PATH: ${{ env.ONNX_LIB_DIR }}:${{ env.LD_LIBRARY_PATH }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cmdChroma-linux-amd64
        path: ./dist/cmdChroma*