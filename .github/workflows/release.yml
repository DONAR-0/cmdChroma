name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Native dependencies (ONNX runtime + tokenizers)
      run: make setup-deps

    - name: Run tests
      run: make test

    - name: Build Linux (amd64)
      run: make build

    - name: Create release archive
      run: |
        mkdir -p releases
        tar -czf releases/cmdChroma-linux-amd64.tar.gz -C dist cmdChroma

    - name: Generate changelog
      id: changelog
      run: |
        LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
        CHANGES=$(git log --oneline --pretty=format:"- %s" ${LATEST_TAG}..HEAD 2>/dev/null || echo "- Initial release")
        {
          echo "changes<<EOF"
          echo "$CHANGES"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Create GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## Changes
          ${{ steps.changelog.outputs.changes }}

          ## Downloads
          - [Linux AMD64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cmdChroma-linux-amd64.tar.gz)
        draft: false
        prerelease: false
        files: |
          releases/cmdChroma-linux-amd64.tar.gz
