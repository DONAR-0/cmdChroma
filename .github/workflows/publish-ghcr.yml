# name: Manual GHCR Publish
name: Manual GHCR Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag (e.g., latest, v1.0.0)'
        required: true
        default: 'latest'

permissions:
  packages: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set lowercase owner environment variable
      run: |
        echo "LOWER_OWNER=${{ toLower(github.repository_owner) }}" >> $GITHUB_ENV

    - name: Log in GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: \${{ github.actor }}
        password: \${{ secrets.GH_TOKEN }}

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push to GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/\${{ env.LOWER_OWNER }}/\${{ github.repository }}:\${{ env.inputs.image_tag }}
          ghcr.io/\${{ env.LOWER_OWNER }}/\${{ github.repository }}:latest
