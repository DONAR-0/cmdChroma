name: Manual GHCR Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag (e.g., latest, v1.0.0)'
        required: true
        default: 'latest'

permissions:
  packages: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push to GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/cmdchroma:${{ github.event.inputs.image_tag }}
          ghcr.io/${{ github.repository_owner }}/cmdchroma:latest
        platforms: linux/amd64,linux/arm64
        cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cmdchroma:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/cmdchroma:buildcache,mode=max

    - name: Output image reference
      run: |
        echo "Successfully published:"
        echo "ghcr.io/${{ github.repository_owner }}/cmdchroma:${{ github.event.inputs.image_tag }}"
        echo "ghcr.io/${{ github.repository_owner }}/cmdchroma:latest"
