# name: Manual GHCR Publish
name: Manual GHCR Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag (e.g., latest, v1.0.0)'
        required: true
        default: 'latest'

permissions:
  packages: write
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set build environment variables
      run: |
        # Extract repository name from full "owner/repo" format
        REPO_NAME="${GITHUB_REPOSITORY#*/}"
        echo "LOWER_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV
        echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV

    - name: Log in GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GH_TOKEN }}

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and Push to GHCR
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ghcr.io/${{ env.LOWER_OWNER }}/${{ env.REPO_NAME }}:${{ env.IMAGE_TAG }}
          ghcr.io/${{ env.LOWER_OWNER }}/${{ env.REPO_NAME }}:latest
