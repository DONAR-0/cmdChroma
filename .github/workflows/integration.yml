name: Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CGO_ENABLED: 1
  CHROMA_HOST: localhost
  CHROMA_PORT: 8000
  ONNX_LIB_DIR: ${{ github.workspace }}/models/onnx_runtime/lib
  TOKENIZER_LIB_DIR: ${{ github.workspace }}/tokenizerLib

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies for CGO
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc libc6-dev
        make setup-deps

    - name: Run integration tests
      run: make venom
