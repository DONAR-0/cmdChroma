version: "2"
name: Test Chroma CLI - Flag and Environment Variable Priority

testcases:
  # ============ Priority Verification: Flag > Env > Default ============

  - name: Flag tenant overrides env var
    steps:
      - type: exec
        script: TENANT=env_tenant_value cmdChroma --log-level error t --tenant flag_tenant_value
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "flag_tenant_value"
          - result.systemout ShouldNotContainSubstring "env_tenant_value"

  - name: Flag database overrides env var
    steps:
      - type: exec
        script: DATABASE=env_database_value cmdChroma --log-level error t --database flag_database_value
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "flag_database_value"
          - result.systemout ShouldNotContainSubstring "env_database_value"

  - name: Flag host overrides env var
    steps:
      - type: exec
        script: CHROMA_HOST=env_host cmdChroma --log-level error t --host 127.0.0.1 --port 8099
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "127.0.0.1:8099"

  - name: Flag port overrides env var
    steps:
      - type: exec
        script: CHROMA_PORT=8000 cmdChroma --log-level error t --port 8099
        assertions:
          - result.code ShouldEqual 0

  # ============ Environment Variable > Default ============

  - name: Env var tenant overrides default_tenant
    steps:
      - type: exec
        script: TENANT=override_tenant cmdChroma --log-level error t
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "override_tenant"
          - result.systemout ShouldNotContainSubstring "default_tenant"

  - name: Env var database overrides default_database
    steps:
      - type: exec
        script: DATABASE=override_database cmdChroma --log-level error t
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "override_database"
          - result.systemout ShouldNotContainSubstring "default_database"

  - name: CHROMA_HOST env var overrides localhost
    steps:
      - type: exec
        script: CHROMA_HOST=0.0.0.0 cmdChroma --log-level error t
        assertions:
          - result.code ShouldEqual 0

  - name: CHROMA_PORT env var overrides 8000
    steps:
      - type: exec
        script: CHROMA_PORT=8099 cmdChroma --log-level error t
        assertions:
          - result.code ShouldEqual 0

  # ============ All Environment Variables Together ============

  - name: All four values via environment variables
    steps:
      - type: exec
        script: |
          CHROMA_HOST=127.0.0.1 \
          CHROMA_PORT=8000 \
          TENANT=all_env_tenant \
          DATABASE=all_env_database \
          cmdChroma --log-level error t
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "all_env_tenant"
          - result.systemout ShouldContainSubstring "all_env_database"
          - result.systemout ShouldContainSubstring "127.0.0.1:8000"

  # ============ All CLI Flags Together ============

  - name: All four values via CLI flags
    steps:
      - type: exec
        script: |
          cmdChroma --log-level error t \
            --host 127.0.0.1 \
            --port 8000 \
            --tenant all_flag_tenant \
            --database all_flag_database
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "all_flag_tenant"
          - result.systemout ShouldContainSubstring "all_flag_database"
          - result.systemout ShouldContainSubstring "127.0.0.1:8000"

  # ============ Mixed Environment and Flags ============

  - name: Host from env, port from flag
    steps:
      - type: exec
        script: CHROMA_HOST=127.0.0.1 cmdChroma --log-level error t --port 8099
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "127.0.0.1:8099"

  - name: Tenant from env, database from flag
    steps:
      - type: exec
        script: TENANT=mixed_env_tenant cmdChroma --log-level error t --database mixed_flag_db
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "mixed_env_tenant"
          - result.systemout ShouldContainSubstring "mixed_flag_db"

  - name: Three from env, one from flag
    steps:
      - type: exec
        script: |
          CHROMA_HOST=127.0.0.1 \
          CHROMA_PORT=8097 \
          TENANT=mixed3_env \
          cmdChroma --log-level error t --database mixed3_flag
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "mixed3_env"
          - result.systemout ShouldContainSubstring "mixed3_flag"
          - result.systemout ShouldContainSubstring "127.0.0.1:8097"

  # ============ Alternative Env Var Names ============

  - name: CHROMA_TENANT env var works
    steps:
      - type: exec
        script: CHROMA_TENANT=chroma_tenant cmdChroma --log-level error t
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "chroma_tenant"

  - name: CHROMA_DATABASE env var works
    steps:
      - type: exec
        script: CHROMA_DATABASE=chroma_database cmdChroma --log-level error t
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "chroma_database"

  # ============ Priority Chain Verification ============

  - name: Default shows default_tenant
    steps:
      - type: exec
        script: cmdChroma --log-level error t
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "default_tenant"
          - result.systemout ShouldContainSubstring "default_database"

  - name: Env override survives flag override for host
    steps:
      - type: exec
        script: CHROMA_HOST=127.0.0.1 cmdChroma --log-level error t --host localhost --port 8099
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "localhost:8099"
          - result.systemout ShouldNotContainSubstring "127.0.0.1"