version: "2"
name: Test Chroma CLI - Delete Collection
testcases:
  - name: Setup - create collection
    steps:
      - type: exec
        script: cmdChroma mkColl t11_del_test
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: cmdChroma collections
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "t11_del_test"
  - name: Delete collection
    steps:
      - type: exec
        script: cmdChroma delete t11_del_test
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Collection 't11_del_test' deleted"
      - type: exec
        script: cmdChroma collections
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldNotContainSubstring "t11_del_test"
  - name: Delete non-existent collection
    steps:
      - type: exec
        script: cmdChroma delete t11_nonexistent
        assertions:
          - result.code ShouldEqual 1
          - result.systemout ShouldContainSubstring "collection 't11_nonexistent' not found"
  - name: cleanup
    always: true
    steps:
      - type: exec
        script: cmdChroma delete t11_del_test || true
        assertions:
          - result.code ShouldEqual 0
