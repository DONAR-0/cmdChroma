version: "2"
name: Test Chroma CLI - Auto Create Database

testcases:
  # ============ Setup: Create custom tenant for testing ============
  
  - name: Setup - Ping to ensure ChromaDB is running
    steps:
      - type: exec
        script: cmdChroma --log-level error t
        assertions:
          - result.code ShouldEqual 0

  # ============ Test: Create collection WITHOUT --create-db (should fail for new tenant/db) ============

  - name: Create collection without --create-db on nonexistent database fails
    steps:
      - type: exec
        script: cmdChroma --log-level error create coll_no_autodb --tenant test_autodb_tenant --database nonexistent_coll_db
        assertions:
          - result.code ShouldNotEqual 0
          - result.systemout ShouldContainSubstring "does not exist"
          - result.systemout ShouldContainSubstring "create-db"

  - name: Error message provides helpful hint
    steps:
      - type: exec
        script: cmdChroma --log-level error create coll_no_autodb2 --tenant test_autodb_tenant --database nonexistent_coll_db2
        assertions:
          - result.code ShouldNotEqual 0
          - result.systemout ShouldContainSubstring "create-db"

  # ============ Test: Create collection WITH --create-db ============

  - name: Create collection with --create-db auto-creates database
    steps:
      - type: exec
        script: cmdChroma --log-level error create coll_with_autodb2 --tenant test_autodb_tenant2 --database autodb_test_db2 --create-db
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Collection 'coll_with_autodb2' created"

  - name: Verify database was created
    steps:
      - type: exec
        script: cmdChroma --log-level error databases --tenant test_autodb_tenant2
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "autodb_test_db2"

  - name: Verify collection exists in auto-created database
    steps:
      - type: exec
        script: cmdChroma --log-level error collections --tenant test_autodb_tenant2 --database autodb_test_db2
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "coll_with_autodb2"

  # ============ Test: --create-db on existing database (should work but not create duplicate) ============

  - name: Create collection with --create-db on existing database works
    steps:
      - type: exec
        script: cmdChroma --log-level error create coll_existing_db --tenant default_tenant --database default_database --create-db
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Collection 'coll_existing_db' created"

  # ============ Test: --create-db with all custom values ============

  - name: Create collection with all custom values and --create-db
    steps:
      - type: exec
        script: cmdChroma --log-level error create full_custom_coll2 --tenant custom_full_tenant2 --database custom_full_db2 --create-db --host localhost --port 8000
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Collection 'full_custom_coll2' created"

  - name: Verify full custom tenant/database were created
    steps:
      - type: exec
        script: cmdChroma --log-level error databases --tenant custom_full_tenant2
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "custom_full_db2"

  # ============ Test: Multiple collections in same auto-created database ============

  - name: Create multiple collections in same auto-created database
    steps:
      - type: exec
        script: cmdChroma --log-level error create multi_coll_1a --tenant multi_coll_tenant2 --database multi_db2 --create-db
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Collection 'multi_coll_1a' created"
      - type: exec
        script: cmdChroma --log-level error create multi_coll_2a --tenant multi_coll_tenant2 --database multi_db2
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Collection 'multi_coll_2a' created"

  - name: Verify both collections exist in same database
    steps:
      - type: exec
        script: cmdChroma --log-level error collections --tenant multi_coll_tenant2 --database multi_db2
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "multi_coll_1a"
          - result.systemout ShouldContainSubstring "multi_coll_2a"

  # ============ Test: --create-db via environment variable (future enhancement) ============

  - name: create-db flag is recognized in help
    steps:
      - type: exec
        script: cmdChroma create --help
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Automatically create the database"

  # ============ Cleanup ============
  - name: Cleanup - Delete test collections and databases
    always: true
    steps:
      # Collections in test_autodb_tenant/autodb_test_db
      - type: exec
        script: cmdChroma --log-level error delete coll_with_autodb --tenant test_autodb_tenant --database autodb_test_db || true
        assertions:
          - result.code ShouldEqual 0
      # Collections in default_tenant/default_database
      - type: exec
        script: cmdChroma --log-level error delete coll_existing_db || true
        assertions:
          - result.code ShouldEqual 0
      # Collections in custom_full_tenant/custom_full_db
      - type: exec
        script: cmdChroma --log-level error delete full_custom_coll --tenant custom_full_tenant --database custom_full_db || true
        assertions:
          - result.code ShouldEqual 0
      # Collections in multi_coll_tenant/multi_db
      - type: exec
        script: cmdChroma --log-level error delete multi_coll_1 --tenant multi_coll_tenant --database multi_db || true
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: cmdChroma --log-level error delete multi_coll_2 --tenant multi_coll_tenant --database multi_db || true
        assertions:
          - result.code ShouldEqual 0