version: "2"
name: Test Chroma CLI - List Databases

testcases:
  - name: dbs should work
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level info dbs
        assertions:
          - result.code ShouldEqual 0
          - result.systemerr ShouldContainSubstring "Listing databases"
          - result.systemout ShouldContainSubstring "default_database"
  - name: ls-dbs should work
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level info ls-dbs
        assertions:
          - result.code ShouldEqual 0
          - result.systemerr ShouldContainSubstring "Listing databases"
          - result.systemout ShouldContainSubstring "default_database"

