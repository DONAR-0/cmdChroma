version: "2"
name: Test Log Level Filtering

testcases:
  - name: Info level shows INFO logs
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level info ping
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring "[INFO]"
      - result.systemerr ShouldNotContainSubstring "[DEBUG]"

  - name: Debug level shows INFO logs
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level debug ping
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring "[INFO]"

  - name: Verbose flag enables debug logging level
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma ping --verbose
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring "[INFO]"

  - name: Warn level hides INFO logs
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level warn ping
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldNotContainSubstring "[INFO]"
      - result.systemerr ShouldNotContainSubstring "[DEBUG]"

  # New tests for --log-format flag

  - name: JSON log format output
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-format json --log-level debug ping
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring '"level"'
      - result.systemerr ShouldContainSubstring '"msg"'
      - result.systemerr ShouldNotContainSubstring "[DEBUG]"
      - result.systemerr ShouldNotContainSubstring "[INFO]"

  - name: Log level flag with error level
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error ping
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldNotContainSubstring "[DEBUG]"
      - result.systemerr ShouldNotContainSubstring "[INFO]"
      - result.systemerr ShouldNotContainSubstring "[WARN]"

  - name: Log format flag with text format
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-format text --log-level debug ping
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring "[DEBUG]"
      - result.systemerr ShouldContainSubstring "[INFO]"
      - result.systemerr ShouldNotContainSubstring '"level"'

  - name: Environment variables for new logging flags
    tags: ["integration"]
    steps:
      - type: exec
        script: CHROMA_LOG_LEVEL=warn CHROMA_LOG_FORMAT=json cmdChroma ping
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring '"level"'
      - result.systemerr ShouldNotContainSubstring "[WARN]"
      - result.systemerr ShouldNotContainSubstring "[INFO]"

  - name: Log format json with info level
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-format json --log-level info tenant
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring '"level":"info"'
      - result.systemerr ShouldNotContainSubstring "[INFO]"

  - name: Mixed log levels with text format
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level debug --log-format text databases
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring "[DEBUG]"
      - result.systemerr ShouldContainSubstring "[INFO]"

  - name: Short alias for log-level flag
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma -l debug ping
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring "[DEBUG]"

  - name: Default log level is info
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma ping
    assertions:
      - result.code ShouldEqual 0
      - result.systemerr ShouldContainSubstring "[INFO]"
      - result.systemerr ShouldNotContainSubstring "[DEBUG]"
