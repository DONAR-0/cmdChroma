version: "2"
name: Test Chroma CLI - Parallel Isolated Instances

testcases:
  # ============ Instance on Port 8097 ============

  - name: Instance A - Ping on port 8097
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error t --port 8097
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Successfully connected"
          - result.systemout ShouldContainSubstring "localhost:8097"

  - name: Instance A - Create collection
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error create coll_port8097 --port 8097
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "'coll_port8097' created"

  - name: Instance A - Verify collection exists
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error records coll_port8097 --port 8097
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "coll_port8097"

  # ============ Instance on Port 8098 ============

  - name: Instance B - Ping on port 8098
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error t --port 8098
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Successfully connected"
          - result.systemout ShouldContainSubstring "localhost:8098"

  - name: Instance B - Create collection (same name, different instance)
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error create coll_port8098 --port 8098
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "'coll_port8098' created"

  - name: Instance B - Verify collection exists
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error records coll_port8098 --port 8098
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "coll_port8098"

  # ============ Instance on Port 8099 ============

  - name: Instance C - Ping on port 8099
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error t --port 8099
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "Successfully connected"
          - result.systemout ShouldContainSubstring "localhost:8099"

  - name: Instance C - Create collection
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error create coll_port8099 --port 8099
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "'coll_port8099' created"

  - name: Instance C - Verify collection exists
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error records coll_port8099 --port 8099
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "coll_port8099"

  # ============ Isolation Verification ============

  - name: Verify collections are isolated between instances
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error records coll_port8097 --port 8097
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "coll_port8097"
          - result.systemout ShouldNotContainSubstring "coll_port8098"
          - result.systemout ShouldNotContainSubstring "coll_port8099"

  - name: Instance A does not have B's collection
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error records coll_port8098 --port 8097
        assertions:
          - result.code ShouldNotEqual 0

  - name: Instance B does not have A's collection
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error records coll_port8097 --port 8098
        assertions:
          - result.code ShouldNotEqual 0

  # ============ Multiple Operations on Different Instances ============

  - name: Ping multiple instances with different tenants
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error t --port 8097 --tenant tenant_a
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "tenant_a"
      - type: exec
        script: cmdChroma --log-level error t --port 8098 --tenant tenant_b
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "tenant_b"

  - name: Verify tenant isolation across instances
    tags: ["integration"]
    steps:
      - type: exec
        script: cmdChroma --log-level error t --port 8097 --tenant tenant_a
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "tenant_a"
      - type: exec
        script: cmdChroma --log-level error t --port 8098 --tenant tenant_b
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "tenant_b"

  # ============ Cleanup ============
  - name: Cleanup - Delete all test collections
    tags: ["integration"]
    always: true
    steps:
      - type: exec
        script: cmdChroma --log-level error delete coll_port8097 --port 8097 || true
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: cmdChroma --log-level error delete coll_port8098 --port 8098 || true
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: cmdChroma --log-level error delete coll_port8099 --port 8099 || true
        assertions:
          - result.code ShouldEqual 0