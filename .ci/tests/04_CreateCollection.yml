version: "2"
name: Test Chroma CLI - Create Collection
testcases:
  - name: Create Collection Error if no collectionName not given
    steps:
      - type: exec
        script: cmdChroma --log-level info mkColl
        assertions:
          - result.code ShouldEqual 1
          - result.systemout ShouldContainSubstring "collection name is required"
  - name: Create Collection Successful
    steps:
      - type: exec
        script: cmdChroma --log-level info mkColl t4_coll1
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "'t4_coll1' created"
          - result.systemout ShouldContainSubstring "t4_coll1"
  - name: Create Another Collection
    steps:
      - type: exec
        script: cmdChroma --log-level info mkColl t4_coll2
        assertions:
          - result.code ShouldEqual 0
          - result.systemout ShouldContainSubstring "'t4_coll2' created"
          - result.systemout ShouldContainSubstring "t4_coll2"
  - name: cleanup
    always: true
    steps:
      - type: exec
        script: cmdChroma --log-level info delete t4_coll1 || true
        assertions:
          - result.code ShouldEqual 0
      - type: exec
        script: cmdChroma --log-level info delete t4_coll2 || true
        assertions:
          - result.code ShouldEqual 0
